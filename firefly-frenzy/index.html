)*45,phase:Math.random()*8,moth})}function burst(a,b,color){for(let i=0;i<12;i++){let q=Math.random()*6.28,s=25+Math.random()*130;sparks.push({x:a,y:b,vx:Math.cos(q)*s,vy:Math.sin(q)*s,life:.7,color})}}function draw(dt){frame+=dt;let g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#172248');g.addColorStop(.58,'#243158');g.addColorStop(1,'#265155');x.fillStyle=g;x.fillRect(0,0,w,h);for(let i=0;i<45;i++){x.globalAlpha=.3+.5*Math.abs(Math.sin(frame*1.4+i));x.fillStyle=i%4?'#e8e7ff':'#ffeaa0';x.beginPath();x.arc((i*137)%w,(i*61)%(h*.63),1.3,0,7);x.fill()}x.globalAlpha=1;let m=x.createRadialGradient(w*.8,h*.2,3,w*.8,h*.2,h*.19);m.addColorStop(0,'#fff3c5');m.addColorStop(1,'#fff3c500');x.fillStyle=m;x.fillRect(w*.55,0,w*.48,h*.5);x.fillStyle='#f8e8b8';x.beginPath();x.arc(w*.8,h*.2,Math.min(w,h)*.055,0,7);x.fill();x.fillStyle='#152d36';x.beginPath();x.moveTo(0,h*.7);for(let a=0;a<=w+20;a+=20)x.lineTo(a,h*.68+Math.sin(a*.013)*16);x.lineTo(w,h);x.lineTo(0,h);x.fill();for(let [a,b] of grass){x.strokeStyle='#65cd8f66';x.beginPath();x.moveTo(a,h);x.quadraticCurveTo(a-4,h-b/2,a+Math.sin(frame+a)*4,h-b);x.stroke()}for(let t of items){let r=t.r*(1+Math.sin(frame*5+t.phase)*.08);let glow=x.createRadialGradient(t.x,t.y,1,t.x,t.y,r*2.7);glow.addColorStop(0,t.moth?'#bcd2ffcc':'#fff9a9ee');glow.addColorStop(1,t.moth?'#a9c4ff00':'#ffe77700');x.fillStyle=glow;x.beginPath();x.arc(t.x,t.y,r*2.7,0,7);x.fill();x.fillStyle=t.moth?'#9ab8f4':'#ffe979';x.beginPath();x.arc(t.x,t.y,r*.55,0,7);x.fill();x.fillStyle=t.moth?'#d6e0ff':'#fffbd7';x.beginPath();x.arc(t.x-r*.17,t.y-r*.17,2,0,7);x.fill();x.strokeStyle=t.moth?'#becfff':'#fff1a9';x.beginPath();x.ellipse(t.x,t.y,r*1.25,r*.45,Math.sin(frame*4+t.phase)*.4,0,7);x.stroke()}for(let p of sparks){x.globalAlpha=Math.max(0,p.life);x.fillStyle=p.color;x.beginPath();x.arc(p.x,p.y,3,0,7);x.fill()}x.globalAlpha=1;if(playing){spawn-=dt;if(spawn<=0){add();spawn=.4+Math.random()*.5}for(let t of items){t.y-=t.v*dt;t.x+=Math.sin(frame*2+t.phase)*18*dt}items=items.filter(t=>t.y>-30);for(let p of sparks){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}sparks=sparks.filter(p=>p.life>0);time-=dt;if(time<=0)finish();timeEl.textContent=Math.ceil(time)}requestAnimationFrame(loop)}function loop(now){let dt=Math.min(.04,(now-last)/1000||0);last=now;draw(dt)}function begin(){score=0;time=30;items=[];sparks=[];combo=0;lastCatch=0;scoreEl.textContent=0;timeEl.textContent=30;overlay.hidden=true;playing=true;last=performance.now();beep(540)}function finish(){playing=false;overlay.hidden=false;document.querySelector('#title').textContent='Lovely catch!';document.querySelector('#copy').textContent='You caught '+score+' firefl'+(score===1?'y':'ies')+'. Can you beat your best?';document.querySelector('#start').textContent='Play again';try{if(score>+(localStorage.fireflyBest||0)){localStorage.fireflyBest=score;bestEl.textContent=score}}catch{}beep(430)}stage.addEventListener('pointerdown',e=>{if(!playing){if(!overlay.hidden)begin();return}let r=c.getBoundingClientRect(),a=e.clientX-r.left,b=e.clientY-r.top;for(let i=items.length-1;i>=0;i--){let t=items[i];if(Math.hypot(a-t.x,b-t.y)<t.r*1.7){items.splice(i,1);if(t.moth){score=Math.max(0,score-3);combo=0;burst(t.x,t.y,'#a9c4ff');beep(180)}else{combo=performance.now()-lastCatch<1100?combo+1:1;lastCatch=performance.now();score+=combo>=3?2:1;burst(t.x,t.y,'#ffe986');beep(540+Math.min(combo,8)*70)}scoreEl.textContent=score;return}}});document.querySelector('#start').onclick=begin;document.querySelector('#sound').onclick=e=>{soundOn=!soundOn;e.currentTarget.textContent=soundOn?'♫ Sound on':'♫ Sound off';if(soundOn)beep()};addEventListener('resize',resize);resize();requestAnimationFrame(loop)})();</script></body></html>
