<!doctype html>
<html lang="en">
<head>  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-4KS1NVMEJ7"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-4KS1NVMEJ7');
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111b30">
  <meta name="description" content="Play a free browser game in the GameBox Arcade player.">
  <title>Play — GameBox Arcade</title>
  <link rel="stylesheet" href="arcade-player.css?v=20261115f">
  <script src="mini-games.js?v=20261115f" defer></script>
  <script src="arcade-player.js?v=20261115f" defer></script>
</head>
<body>
  <header class="player-header">
    <a class="brand" href="index.html"><span aria-hidden="true">✳</span> GAMEBOX ARCADE</a>
    <h1 id="playerTitle">Loading game…</h1>
    <div class="header-actions"><button id="fullscreenGame" class="fullscreen-button" type="button" aria-label="Play fullscreen" title="Play fullscreen">⛶</button><a class="back-link" href="index.html#games">← All games</a></div>
  </header>

  <main class="dashboard">
    <div class="dashboard-grid">
      <aside class="side-rail left-rail" aria-label="Recommended games">
        <p class="rail-heading">PLAY NEXT</p>
        <div id="leftRecommendations" class="recommendation-list"></div>
      </aside>

      <section class="center-column" aria-label="Game player">
        <div class="game-frame-wrap">
          <iframe id="gameFrame" title="Game" allow="fullscreen; autoplay; gamepad" allowfullscreen></iframe>
          <div class="load-error" id="loadError" hidden>We couldn’t open this game. <a href="index.html#games">Choose another game</a>.</div>
        </div>
        <div class="game-actionbar" id="gameActionbar">
          <div class="game-action-title"><span id="gameBadge" aria-hidden="true">🎮</span><strong id="actionGameTitle">Loading game…</strong></div>
          <div class="game-action-buttons" role="group" aria-label="Game actions">
            <button class="game-action" type="button" data-reaction="like" aria-label="Like game" aria-pressed="false">👍 <span>Like</span></button>
            <button class="game-action" type="button" data-reaction="dislike" aria-label="Dislike game" aria-pressed="false">👎 <span>Dislike</span></button>
            <button class="game-action" type="button" data-reaction="favorite" aria-label="Add to favorites" aria-pressed="false">☆ <span>Favorite</span></button>
          </div>
        </div>
      </section>

      <aside class="side-rail right-rail" aria-label="Recommended games">
        <p class="rail-heading">MORE GAMES</p>
        <div id="rightRecommendations" class="recommendation-list"></div>
      </aside>
    </div>

    <section class="below-row" aria-label="More games">
      <div class="below-games"><div id="bottomRecommendations" class="bottom-recommendations"></div><div id="adsensePlayerBelow" class="ad-slot player-ad-slot" data-ad-placement="player-below" aria-label="Advertisement space"><span>ADVERTISEMENT</span></div></div>
    </section>
  </main>
  <footer class="player-footer"><a href="index.html">GameBox Arcade</a><a href="privacy.html">Privacy</a></footer>
</body>
</html>
