<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111b30">
  <meta name="description" content="Play a free browser game in the GameBox Arcade player.">
  <title>Play — GameBox Arcade</title>
  <link rel="stylesheet" href="arcade-player.css">
  <script src="arcade-player.js" defer></script>
</head>
<body>
  <header class="player-header">
    <a class="brand" href="index.html"><span aria-hidden="true">✳</span> GAMEBOX ARCADE</a>
    <h1 id="playerTitle">Loading game…</h1>
    <a class="back-link" href="index.html#games">← All games</a>
  </header>

  <main class="dashboard">
    <section class="top-recommendations" aria-label="Recommended games">
      <div class="rail-heading">JUMP INTO A GAME</div>
      <div id="topRecommendations" class="top-recommendation-list"></div>
    </section>
    <div class="dashboard-grid">
      <aside class="side-rail left-rail" aria-label="Recommended games and advertisement">
        <div class="rail-heading">TRY THESE NEXT</div>
        <div id="leftRecommendations" class="recommendation-list"></div>
        <div class="ad-slot side-ad" aria-label="Advertisement space"><span>ADVERTISEMENT</span></div>
      </aside>

      <section class="center-column" aria-label="Game player">
        <div class="game-frame-wrap">
          <iframe id="gameFrame" title="Game" allow="fullscreen; autoplay; gamepad" allowfullscreen></iframe>
          <div class="load-error" id="loadError" hidden>We couldn’t open this game. <a href="index.html#games">Choose another game</a>.</div>
        </div>
        <div class="player-tools"><span>PLAYING ON GAMEBOX ARCADE</span><a id="openGame" href="#" target="_blank" rel="noopener">Open game in a new tab ↗</a></div>
      </section>

      <aside class="side-rail right-rail" aria-label="More games and advertisement">
        <div class="rail-heading">MORE TO PLAY</div>
        <div id="rightRecommendations" class="recommendation-list"></div>
        <div class="ad-slot side-ad" aria-label="Advertisement space"><span>ADVERTISEMENT</span></div>
      </aside>
    </div>

    <section class="below-row" aria-label="More games and advertisement">
      <div class="below-games"><div class="rail-heading">KEEP THE FUN GOING</div><div id="bottomRecommendations" class="bottom-recommendations"></div></div>
      <div class="ad-slot bottom-ad" aria-label="Advertisement space"><span>ADVERTISEMENT</span></div>
    </section>
  </main>
  <footer class="player-footer"><a href="index.html">GameBox Arcade</a><a href="privacy.html">Privacy</a></footer>
</body>
</html>
